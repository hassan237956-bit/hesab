  --amber: #ffc966; --amber-bg: #35280c; --violet: #cbabf7; --violet-bg: #2a1d44;
  --shadow: 0 10px 30px rgb(0 0 0 / .5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --ground: #0a121d; --surface: #121d2c; --raised: #182638; --ink: #e9f0f7; --soft: #a8b8cd; --line: #263750; --field: #0e1826;
    --brand: #0f7c8a; --on-brand: #ffffff; --brand-bg: #10343c; --brand-ink: #7fd7e0;
    --green: #74dc9b; --green-bg: #11301f; --red: #ff9aa8; --red-bg: #3a1822; --blue: #a3bcff; --blue-bg: #19264a;
    --amber: #ffc966; --amber-bg: #35280c; --violet: #cbabf7; --violet-bg: #2a1d44;
    --shadow: 0 10px 30px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}

/* one colour name → its ink and its tint */
.c-green { --c: var(--green); --c-bg: var(--green-bg); }
.c-red, .c-rose { --c: var(--red); --c-bg: var(--red-bg); }
.c-blue, .c-navy { --c: var(--blue); --c-bg: var(--blue-bg); }
.c-gold, .c-orange { --c: var(--amber); --c-bg: var(--amber-bg); }
.c-violet { --c: var(--violet); --c-bg: var(--violet-bg); }
.c-teal { --c: var(--brand-ink); --c-bg: var(--brand-bg); }
.c-sage { --c: var(--green); --c-bg: var(--green-bg); }
.c-grey { --c: var(--soft); --c-bg: var(--ground); }

/* ---------------------------------------------------------------- base */
html { font-size: 18px; -webkit-text-size-adjust: 100%; }
html[data-size="normal"] { font-size: 16px; }
html[data-size="huge"] { font-size: 21px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 600 1rem/1.75 Vazirmatn, Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.28rem; font-weight: 900; line-height: 1.5; }
h2 { font-size: 1.08rem; font-weight: 900; }
h3 { font-size: 1rem; font-weight: 900; }
h3:empty { display: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
small { font-size: .85rem; line-height: 1.7; }
.muted { color: var(--soft); font-size: .9rem; }
.ico { width: 1.45em; height: 1.45em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); align-items: start; }
.wide { grid-column: 1 / -1; }
.two { display: flex; flex-wrap: wrap; gap: .5rem; } .two > * { flex: 1 1 8rem; }
.in-text { color: var(--green); } .out-text { color: var(--red); } .bal-text { color: var(--blue); }

/* ---------------------------------------------------------------- numbers: never cut, they shrink just enough for their box */
/* cqi = a hundredth of the width of the surrounding box; --len = the number of characters */
.num { font-variant-numeric: tabular-nums; font-weight: 900; white-space: nowrap; font-size: min(1em, calc(155cqi / var(--len, 8))); }
.num.big { display: inline-block; font-size: min(2.15rem, calc(155cqi / var(--len, 8))); letter-spacing: -.01em; line-height: 1.35; }
.num.short { font-size: min(1em, calc(165cqi / var(--len, 8))); }
.card, .worth, .entry, .ledger, .effect, .option, .picked, .head-card, .tile, .beam-head, .due { container-type: inline-size; }
.num.neg, .num.out { color: var(--red); }
.num.in { color: var(--green); }
.num.bal { color: var(--blue); }
html[data-hide="1"] main .num, html[data-hide="1"] main .words { filter: blur(.42em); user-select: none; }
html[data-hide="1"] main input.num, html[data-hide="1"] main .entry-form .num { filter: none; }

/* ---------------------------------------------------------------- the frame */
.shell { min-height: 100vh; padding-bottom: calc(5.4rem + env(safe-area-inset-bottom)); }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .55rem; padding: .5rem .75rem; padding-top: calc(.5rem + env(safe-area-inset-top)); background: var(--ground); border-bottom: 1px solid var(--line); }
.top .titles { flex: 1; min-width: 0; }
.top h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: min(1.35rem, 5.8vw); }
.top .sub { font-size: .82rem; color: var(--soft); line-height: 1.5; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; font-size: 1rem; padding: 0; }
.icon-btn.on { background: var(--brand-bg); color: var(--brand-ink); border-color: transparent; }
.trial { display: flex; align-items: center; gap: .45rem; background: var(--amber-bg); color: var(--amber); font-size: .84rem; font-weight: 800; padding: .3rem .75rem; line-height: 1.6; }
main { padding: .8rem .75rem 1rem; max-width: 70rem; margin: 0 auto; }

.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 6; display: flex; align-items: stretch; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; min-width: 0; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05rem; padding: .4rem 0 .35rem; font-size: min(.76rem, 3.5vw); font-weight: 800; color: var(--soft); line-height: 1.6; }
.tab .tab-ico { display: flex; align-items: center; justify-content: center; width: min(3.1rem, 100%); height: 1.9rem; border-radius: 99px; font-size: 1rem; }
.tab.on { color: var(--ink); } .tab.on .tab-ico { background: var(--brand-bg); color: var(--brand-ink); }
.tab.add .tab-ico { width: 3.3rem; height: 3.3rem; margin-top: -1.5rem; background: var(--brand); color: var(--on-brand); font-size: 1.3rem; border: 4px solid var(--surface); box-sizing: content-box; }
.tab.add .ico { stroke-width: 2.6; }
.side-only { display: none; }
@media (min-width: 900px) {
  .shell { padding-bottom: 1rem; padding-right: 14.5rem; }
  .tabs { inset: 0 0 0 auto; width: 14.5rem; flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 0; padding: .6rem .6rem 1rem; border-top: 0; border-left: 1px solid var(--line); overflow-y: auto; }
  .side-only { display: flex; }
  .phone-only { display: none; }
  .brand-line { align-items: center; gap: .55rem; font-size: 1.15rem; font-weight: 900; padding: 0 .5rem .6rem; }
  .side-group { font-size: .74rem; color: var(--soft); font-weight: 800; padding: .35rem .75rem 0; }
  .tab, .tab.add { flex: none; flex-direction: row; justify-content: flex-start; gap: .55rem; padding: .08rem .6rem; font-size: .88rem; line-height: 1.7; border-radius: .6rem; }
  .tab .tab-ico, .tab.add .tab-ico { width: 1.55rem; height: 1.7rem; margin: 0; border: 0; background: none; color: inherit; font-size: .92rem; box-sizing: border-box; }
  .tab.on { background: var(--brand-bg); color: var(--brand-ink); } .tab.on .tab-ico { background: none; }
  .tab.add { background: var(--brand); color: var(--on-brand); margin-top: .3rem; } .tab.add.on { background: var(--brand); color: var(--on-brand); }
}

/* ---------------------------------------------------------------- surfaces and lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: .85rem .9rem; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .2rem .6rem; padding-bottom: .35rem; margin-bottom: .15rem; }
.card.pending { border-color: var(--amber); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; padding: .3rem .1rem 0; }
.more { font-size: .88rem; color: var(--brand-ink); font-weight: 900; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: .1rem .75rem; }
.list > * + *, .list > .item + .item, .card .item + .item { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: .65rem; width: 100%; min-height: 3.4rem; padding: .5rem .05rem; background: none; border: 0; text-align: right; }
a.item:active, button.item:active { background: var(--brand-bg); }
.item { flex-wrap: wrap; row-gap: 0; }
.item-main { display: flex; flex-direction: column; flex: 1 1 7.2rem; min-width: 0; }
.item-title { font-weight: 800; overflow-wrap: anywhere; line-height: 1.7; }
.item-main small { color: var(--soft); font-weight: 600; }
.item-end { display: flex; flex-direction: column; align-items: flex-end; flex: none; max-width: 100%; margin-inline-start: auto; }
.item-end .num { font-size: .98rem; }
.mark { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; flex: none; border-radius: .7rem; background: var(--c-bg, var(--brand-bg)); color: var(--c, var(--brand-ink)); font-size: .98rem; }
.line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 .8rem; padding: .38rem .05rem; border-bottom: 1px solid var(--line); }
.line > span:first-child { color: var(--soft); }
.line > span:last-child { margin-inline-start: auto; text-align: left; }
.line:last-child { border-bottom: 0; }
.line.strong > span:first-child { color: var(--ink); font-weight: 900; }
.note { padding: .35rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.badge { display: inline-block; background: var(--c-bg, var(--blue-bg)); color: var(--c, var(--blue)); border-radius: 99px; padding: 0 .6rem; font-size: .76rem; font-weight: 900; line-height: 1.8; white-space: nowrap; }
.empty { display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 2rem 1rem; text-align: center; color: var(--soft); }
.empty > .ico { font-size: 2rem; opacity: .7; }

.alert { border-radius: .8rem; padding: .55rem .75rem; font-weight: 800; font-size: .94rem; }
.alert:has(> .ico) { display: flex; gap: .55rem; align-items: flex-start; }
.alert > .ico { font-size: .95rem; margin-top: .18em; }
.alert > span { flex: 1; min-width: 0; }
.alert.good { background: var(--green-bg); color: var(--green); }
.alert.bad { background: var(--red-bg); color: var(--red); }
.alert.warn { background: var(--amber-bg); color: var(--amber); }
.alert.info { background: var(--blue-bg); color: var(--blue); }

/* ---------------------------------------------------------------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 1.5px solid transparent; border-radius: .75rem; padding: .5rem .95rem; font-weight: 900; text-align: center; min-height: 2.85rem; background: none; line-height: 1.6; }
.btn .ico { font-size: .95rem; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: var(--surface); border-color: var(--line); }
.btn.soft { background: var(--c-bg, var(--brand-bg)); color: var(--c, var(--brand-ink)); }
.btn.danger { background: var(--red); color: var(--surface); }
.btn.small { min-height: 2.4rem; padding: .2rem .7rem; font-size: .88rem; }
.btn:disabled { opacity: .45; }
.btn.file { position: relative; cursor: pointer; }
.btn.file input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.btn.file:focus-within { outline: 3px solid var(--brand); }
.field { display: flex; flex-direction: column; gap: .2rem; }
.field > span, .label { font-weight: 900; font-size: .94rem; }
.field-row { display: flex; gap: .4rem; align-items: center; }
.field-row > span { align-self: center; }
input[type="text"], input[type="password"], input[type="search"], .field input, select { width: 100%; background: var(--field); border: 1.5px solid var(--line); border-radius: .75rem; padding: .45rem .75rem; min-height: 2.85rem; }
input:focus, select:focus { border-color: var(--brand); }
select { flex: 1; min-width: 0; }
.field select { flex: none; }
.check { display: flex; gap: .55rem; align-items: center; } .check input { width: 1.35rem; height: 1.35rem; flex: none; accent-color: var(--brand); }
.search-box { position: relative; }
.search-box .ico { position: absolute; inset-inline-start: .75rem; top: 50%; translate: 0 -50%; color: var(--soft); pointer-events: none; }
.search-box input { padding-inline-start: 2.75rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 99px; padding: .15rem .85rem; font-weight: 800; font-size: .9rem; min-height: 2.35rem; }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.segments { display: flex; flex-wrap: wrap; gap: .2rem; background: var(--surface); border: 1px solid var(--line); border-radius: .85rem; padding: .22rem; }
.segments button { flex: 1 1 auto; min-width: 0; white-space: nowrap; min-height: 2.4rem; background: none; border: 0; border-radius: .65rem; font-weight: 800; font-size: .88rem; color: var(--soft); padding: .1rem .35rem; line-height: 1.5; }
.segments button.on { background: var(--brand); color: var(--on-brand); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: .8rem; width: 100%; text-align: right; background: none; border: 0; padding: .35rem 0; }
.switch-text { display: flex; flex-direction: column; } .switch-text small { color: var(--soft); }
.switch-knob { width: 3.2rem; height: 1.85rem; flex: none; border-radius: 99px; background: var(--line); padding: .18rem; direction: ltr; }
.switch-knob span { display: block; width: 1.49rem; height: 1.49rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: translate .18s; }
.switch.on .switch-knob { background: var(--brand); } .switch.on .switch-knob span { translate: 1.35rem 0; }

/* ---------------------------------------------------------------- home */
.home { display: flex; flex-direction: column; gap: .9rem; }
.worth { padding: .1rem .15rem 0; }
.worth-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.worth-label { font-weight: 800; color: var(--soft); }
.worth .num.big { font-size: min(2.5rem, calc(160cqi / var(--len, 8))); }
.worth-unit { font-size: .9rem; color: var(--soft); font-weight: 800; margin-inline-start: .35rem; }
.worth-change { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .4rem; font-size: .9rem; font-weight: 800; }
.worth-change.up { color: var(--green); } .worth-change.down { color: var(--red); }
.trend { position: relative; width: 100%; height: 4.8rem; margin-top: .35rem; touch-action: pan-y; cursor: crosshair; border-radius: .4rem; }
.trend svg { display: block; width: 100%; height: 100%; overflow: visible; }
.trend .stroke { fill: none; stroke: var(--brand); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.trend .zero { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.trend-dot { position: absolute; width: .62rem; height: .62rem; margin: -.31rem; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--ground); pointer-events: none; }
.trend-hair { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--soft); opacity: .55; pointer-events: none; }
.trend-ends { display: flex; justify-content: space-between; align-items: center; gap: .5rem; min-height: 1.7rem; font-size: .78rem; color: var(--soft); font-weight: 800; }
.trend-read { flex: 1; text-align: center; font-size: .92rem; color: var(--ink); }
.trend-list > summary { cursor: pointer; font-weight: 900; font-size: .86rem; color: var(--brand); padding: .3rem 0; }

/* the balance drawn: what there is, and whose it is — two columns of the same height */
.beam { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
.beam-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.beam-head { display: flex; flex-direction: column; line-height: 1.55; padding: 0 .1rem .2rem; }
.beam-head span { font-size: .82rem; color: var(--soft); font-weight: 800; }
.beam-head .num { font-size: min(1.05rem, calc(155cqi / var(--len, 8))); }
/* too narrow for every digit (small phone, very large text): said in billions or millions instead of shrinking away */
.beam-head .num.short { display: none; }
@container (max-width: 7.6rem) { .beam-head .num { display: none; } .beam-head .num.short { display: inline; font-size: min(1.05rem, calc(165cqi / var(--len, 8))); } }
.beam-stack { display: flex; flex-direction: column; gap: 3px; min-height: 17rem; flex: 1; }
.tile { display: flex; flex-direction: column; justify-content: center; gap: 0; flex: var(--share) 1 0%; padding: .25rem .6rem; border-radius: .55rem; background: var(--tile); color: #fff; line-height: 1.55; animation: tile-in .5s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--i, 0) * 45ms); transform-origin: top; }
/* never lower than two lines, never lower than its own words (they may take three on a narrow screen) */
.tile { min-height: auto; }
.tile span:first-child { font-size: .8rem; font-weight: 800; opacity: .95; }
.tile .num { color: #fff; font-size: min(1rem, calc(165cqi / var(--len, 8))); }
.tile:focus-visible { outline-color: var(--ink); }
@keyframes tile-in { from { opacity: 0; transform: scaleY(.6); } }
.beam-foot { display: flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 900; font-size: .9rem; color: var(--green); }
.beam-foot.bad { color: var(--red); }
.beam-less { font-size: .82rem; color: var(--red); font-weight: 800; }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; }
.quick a { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; font-size: .78rem; font-weight: 800; line-height: 1.55; padding: .6rem .15rem .45rem; background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; min-width: 0; }
.quick .mark { width: 2.8rem; height: 2.8rem; font-size: 1.1rem; }

.todo { display: flex; align-items: center; gap: .65rem; padding: .6rem 0; }
.todo + .todo { border-top: 1px solid var(--line); }
.todo .item-main .item-title { font-size: .96rem; }
.todo .btn { flex: none; margin-inline-start: auto; }
/* on a small screen with very large text the button goes under, so the words keep their width */
.todo { flex-wrap: wrap; } .todo .item-main { flex: 1 1 6.5rem; }
.flow { display: flex; flex-direction: column; gap: .15rem; padding: .3rem 0; container-type: inline-size; }
.flow-top { display: flex; justify-content: space-between; gap: .6rem; font-size: .9rem; font-weight: 800; }
.flow-bar { height: .65rem; background: var(--ground); border-radius: 99px; overflow: hidden; }
.flow-bar span { display: block; height: 100%; background: var(--c); border-radius: 99px; }
@media (min-width: 900px) {
  .home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 1rem 1.25rem; }
  .home > .col-a, .home > .col-b { display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
  .beam-stack { min-height: 21rem; }
}
.home > .col-a, .home > .col-b { display: contents; }
@media (min-width: 900px) { .home > .col-a, .home > .col-b { display: flex; } }

/* ---------------------------------------------------------------- the menu */
.menu-group { display: flex; flex-direction: column; gap: .4rem; }
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(30%, 7.2rem), 1fr)); gap: .5rem; }
.menu a { display: flex; flex-direction: column; align-items: center; gap: .4rem; text-align: center; font-weight: 800; font-size: .86rem; line-height: 1.55; padding: .75rem .25rem .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: .95rem; }
.menu .mark { width: 3rem; height: 3rem; font-size: 1.15rem; }

/* ---------------------------------------------------------------- records */
.day { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .35rem .2rem 0; font-size: .88rem; font-weight: 900; color: var(--soft); }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: .95rem; padding: .15rem .7rem; }
.entry-main { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .65rem; width: 100%; background: none; border: 0; padding: .5rem 0; text-align: right; }
.entry-text { display: flex; flex-direction: column; flex: 1 1 8.4rem; min-width: 0; }
.entry-desc { font-weight: 800; overflow-wrap: anywhere; line-height: 1.7; }
.sides { display: block; font-size: .83rem; color: var(--soft); line-height: 1.65; overflow-wrap: anywhere; }
.entry-end { display: flex; flex-direction: column; align-items: flex-end; flex: none; max-width: 100%; margin-inline-start: auto; line-height: 1.6; }
.entry-end .num { font-size: .98rem; }
.entry-top { font-size: .76rem; color: var(--soft); font-weight: 700; }
.entry-more { border-top: 1px solid var(--line); padding: .25rem 0 .6rem; display: flex; flex-direction: column; }
.entry-more .two, .entry-more > .stack { margin-top: .5rem; }
.entry > .alert { margin-bottom: .5rem; }

.head-card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: .85rem .9rem; display: flex; flex-direction: column; gap: .45rem; }
.head-title { display: flex; align-items: center; gap: .65rem; }
.head-title h2 { font-size: 1.2rem; overflow-wrap: anywhere; line-height: 1.6; }
.head-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .4rem; margin-top: .2rem; }
.facts { display: flex; flex-wrap: wrap; gap: .4rem; }
.fact { flex: 1 1 9rem; display: flex; flex-direction: column; background: var(--ground); border-radius: .7rem; padding: .35rem .6rem; container-type: inline-size; }
.fact small { color: var(--soft); font-weight: 800; }

/* one line of an account: what moved, and what was left after it */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: .95rem; padding: .15rem .7rem; }
.ledger-main { display: flex; flex-wrap: wrap; align-items: stretch; gap: .1rem .65rem; width: 100%; background: none; border: 0; padding: .5rem 0; text-align: right; }
.ledger-bar { width: .34rem; flex: none; border-radius: 99px; background: var(--c); }
.ledger-text { display: flex; flex-direction: column; flex: 1 1 8.4rem; min-width: 0; justify-content: center; }
.ledger-end { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; flex: none; max-width: 100%; margin-inline-start: auto; line-height: 1.6; }
.ledger-end .move { font-size: 1.04rem; }
.ledger-end .rest { font-size: .8rem; color: var(--blue); font-weight: 800; }
.ledger-end .rest .num { font-size: .86rem; color: var(--blue); }
.ledger-end .rest .num.neg { color: var(--red); }
.ledger > .entry { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 0; }

.bar { height: .7rem; background: var(--ground); border-radius: 99px; overflow: hidden; margin: .2rem 0 .4rem; }
.bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; }

/* ---------------------------------------------------------------- recording */
.entry-form { max-width: 40rem; margin: 0 auto; width: 100%; }
.op-group { margin: .35rem .1rem .45rem; font-size: .95rem; color: var(--soft); }
.ops { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(min(30%, 7.4rem), 1fr)); }
.op { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: .4rem; text-align: center; min-height: 6.6rem; padding: .65rem .3rem .45rem; background: var(--surface); border: 1px solid var(--line); border-radius: .95rem; font-weight: 800; font-size: .84rem; line-height: 1.55; }
.op .mark { width: 2.9rem; height: 2.9rem; font-size: 1.12rem; }
.op:active { background: var(--c-bg); }
.op-head { display: flex; gap: .7rem; align-items: center; background: var(--c-bg); color: var(--ink); border-radius: 1rem; padding: .7rem .8rem; }
.op-head .mark { background: var(--surface); width: 2.9rem; height: 2.9rem; font-size: 1.12rem; }
.op-head h2 { color: var(--c); }
.op-head p { font-size: .86rem; color: var(--soft); }
.field input.amount { font-size: 1.4rem; font-weight: 900; text-align: left; direction: ltr; }
.words { color: var(--amber); font-weight: 800; }
/* the date gets a line of its own, so it is never cut however large the text is */
.date-row { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.date-row input { grid-column: 1 / -1; grid-row: 1; min-width: 0; text-align: center; font-weight: 900; font-size: 1.2rem; }
.date-row .btn { min-height: 2.4rem; padding: .2rem .6rem; font-size: .88rem; }
.date-note { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.picker { display: flex; flex-direction: column; gap: .25rem; }
.picked { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 .7rem; width: 100%; text-align: right; background: var(--field); border: 1.5px solid var(--line); border-inline-start: .4rem solid var(--brand); border-radius: .75rem; padding: .5rem .75rem; min-height: 3.1rem; }
.picker.side-dr .picked { border-inline-start-color: var(--green); } .picker.side-cr .picked { border-inline-start-color: var(--red); }
.picked.blank { border-style: dashed; border-inline-start-style: solid; color: var(--soft); }
.picked-name { font-weight: 900; font-size: 1.04rem; overflow-wrap: anywhere; }
.options { display: flex; flex-direction: column; gap: .4rem; background: var(--raised); border: 2px solid var(--brand); border-radius: .9rem; padding: .5rem; }
.option-list { max-height: 19rem; overflow-y: auto; }
.option { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 .7rem; width: 100%; text-align: right; background: none; border: 0; border-bottom: 1px solid var(--line); padding: .5rem .35rem; }
.option > span:first-child { display: flex; flex-direction: column; font-weight: 800; } .option small { color: var(--soft); font-weight: 600; }
.option > .num { margin-inline-start: auto; }
.option.on { background: var(--brand-bg); } .option.add { color: var(--green); font-weight: 900; }
.units .chip { flex: 1; }
.swap { align-self: center; }
.effect { border-radius: .75rem; padding: .4rem .65rem; margin-top: .35rem; }
.effect.in { background: var(--green-bg); } .effect.out { background: var(--red-bg); }
.effect-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 .7rem; }
.effect.in .effect-top > span { color: var(--green); font-weight: 900; } .effect.out .effect-top > span { color: var(--red); font-weight: 900; }
.effect .num { color: inherit; } .effect-bottom { font-size: .88rem; color: var(--soft); }
.check.tick { background: var(--red-bg); color: var(--red); border-radius: .75rem; padding: .6rem .75rem; font-weight: 900; }
.action-bar { display: flex; flex-direction: column; gap: .35rem; background: var(--ground); padding: .5rem 0; border-top: 1px solid var(--line); }
.action-bar .two > * { flex: 1 1 0; min-width: 0; padding-inline: .35rem; }
.action-bar.ready { position: sticky; bottom: calc(5.2rem + env(safe-area-inset-bottom)); z-index: 4; }
@media (min-width: 900px) { .action-bar.ready { bottom: 0; } }
/* scrolling to a box leaves it clear of the bars at the top and bottom */
.entry-form :is(input, select, button) { scroll-margin: 5rem 0 11rem; }
.verdict { font-size: .88rem; font-weight: 800; color: var(--amber); } .verdict.bad { color: var(--red); }
.done-mark { display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: 1rem 0 .3rem; text-align: center; font-size: 1.25rem; font-weight: 900; color: var(--green); }
.done-mark .mark { width: 4.2rem; height: 4.2rem; border-radius: 50%; font-size: 1.9rem; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.done-mark.bad { color: var(--red); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.places { display: grid; gap: .45rem; grid-template-columns: repeat(auto-fill, minmax(min(46%, 10rem), 1fr)); }
.place { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; min-height: 3.6rem; padding: .45rem .5rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: .8rem; font-weight: 900; line-height: 1.6; overflow-wrap: anywhere; }
.place small { font-weight: 700; color: var(--soft); }
.place.on { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.place.on small { color: var(--on-brand); }
.entry-form .fill { align-self: flex-start; }
.move-row { display: flex; flex-direction: column; gap: .3rem; padding: .6rem 0; border-top: 1px solid var(--line); }
.actions { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: .35rem; }
.actions .btn { flex-direction: column; gap: .15rem; min-height: 3.6rem; padding: .35rem .15rem; font-size: .8rem; text-align: center; }
.actions .btn .ico { font-size: 1.25rem; }
.card-head + .move-row, .card-head + * > .move-row:first-child { border-top: 0; }

/* ---------------------------------------------------------------- the month */
.month-nav { display: flex; align-items: center; gap: .5rem; }
.month-nav h2 { flex: 1; text-align: center; font-size: min(1.25rem, 5.4vw); }
.month-nav .btn { padding-inline: .6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.4rem, 1fr)); gap: .45rem; }
.stat { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: .85rem; padding: .45rem .65rem; container-type: inline-size; }
.stat small { color: var(--soft); font-weight: 800; }
.stat .num { font-size: min(1.15rem, calc(150cqi / var(--len, 8))); }
.stat .num.short { font-size: min(1.15rem, calc(180cqi / var(--len, 8))); }
.stat b { font-size: 1.15rem; }
.due { display: flex; flex-direction: column; gap: .45rem; padding: .7rem 0; }
.due + .due { border-top: 1px solid var(--line); }
.due-top { display: flex; align-items: center; gap: .65rem; }
.due-why { font-size: .86rem; font-weight: 800; color: var(--amber); }
.due-why.auto { color: var(--green); }
.share-row { display: flex; align-items: center; gap: .6rem; padding: .55rem 0; }
.share-row + .share-row, .share + .share { border-top: 1px solid var(--line); }
.share input[type="checkbox"] { width: 1.5rem; height: 1.5rem; flex: none; accent-color: var(--brand); }
.share-open { background: var(--ground); border-radius: .75rem; padding: .65rem; margin-bottom: .6rem; }
.share-name { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .45rem; background: none; border: 0; padding: 0; text-align: right; min-height: 2.6rem; }
.share-name .item-title { flex-basis: 100%; }
.share-name .ico, .due-end > .ico { flex: none; color: var(--soft); transition: rotate .2s; } .share-name .ico.turned, .due-end > .ico.turned { rotate: 180deg; }
.due-end { display: flex; align-items: center; gap: .45rem; flex: none; max-width: 100%; margin-inline-start: auto; }
.share-amount { flex: none; width: 8.6rem; text-align: left; font-weight: 900; }
.share-row input[type="text"].share-amount { width: 8.6rem; direction: ltr; min-height: 2.6rem; padding-inline: .5rem; font-size: 1.02rem; }
.due-row { display: flex; align-items: center; gap: .65rem; width: 100%; background: none; border: 0; padding: .15rem 0; text-align: right; min-height: 3rem; }
.due-row { flex-wrap: wrap; }
.due-row .item-main, .due-top .item-main { flex: 1 1 8.5rem; min-width: 0; }
.due-top { flex-wrap: wrap; }

/* ---------------------------------------------------------------- getting in, settings, messages */
.access { max-width: 32rem; margin: 1.2rem auto; width: calc(100% - 1.4rem); }
.access-brand { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: 2rem 1rem .4rem; text-align: center; }
.access-brand .mark { width: 4.4rem; height: 4.4rem; border-radius: 1.2rem; font-size: 2rem; background: var(--brand); color: var(--on-brand); }
.access-brand h1 { font-size: 1.7rem; }
.code { font: 900 1.25rem/2 ui-monospace, Consolas, monospace; background: var(--amber-bg); color: var(--amber); border: 2px dashed var(--amber); border-radius: .8rem; padding: .6rem; text-align: center; overflow-wrap: anywhere; user-select: all; }
.unsaved { margin: .5rem .75rem; }
.toast { position: fixed; z-index: 8; top: calc(env(safe-area-inset-top) + 4.4rem); inset-inline: .7rem; max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: .55rem; background: #0c1b2e; color: #fff; border: 1px solid rgb(255 255 255 / .18); border-radius: .95rem; padding: .5rem .6rem .5rem .75rem; font-weight: 800; font-size: .92rem; box-shadow: var(--shadow); animation: drop .25s ease-out; }
.toast > span { flex: 1; } .toast .btn { background: #fff; color: #0c1b2e; min-height: 2.35rem; padding: .2rem .7rem; white-space: nowrap; }
.toast-close { display: inline-flex; background: none; border: 0; color: inherit; padding: .4rem; }
/* on a wide screen the middle of the top bar is empty: the message sits there and covers no work */
@media (min-width: 900px) { .toast { top: .45rem; inset-inline: 15.5rem 1rem; max-width: 27rem; } }
.service { border: 1px solid var(--line); border-radius: .9rem; padding: .7rem; }
.service h3 { display: flex; align-items: center; gap: .5rem; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------------------------------------------------------------- on paper */
/* ---------------------------------------------------------------- what arrived of a file */
.card.arrival { border: 2px solid var(--green); } .card.arrival.bad { border-color: var(--red); }
.arrival-head { display: flex; align-items: center; gap: .6rem; font-size: 1.1rem; }
.arrival-counts { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; margin: 0; padding: 0; }
.arrival-counts li { background: var(--green-bg); border-radius: 99px; padding: .15rem .75rem; font-weight: 800; }
.arrival-own { background: var(--blue-bg); border-radius: .75rem; padding: .5rem .8rem; container-type: inline-size; }
.arrival-own span { font-weight: 800; }
.arrival-own p { display: flex; align-items: baseline; gap: .35rem; justify-content: flex-end; }
.arrival-own .num { font-size: min(1.7rem, calc(150cqi / var(--len, 8))); }

/* ---------------------------------------------------------------- earlier copies */
.version + .version { border-top: 1px solid var(--line); }
.version-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; width: 100%; min-height: 3.2rem; background: none; border: 0; padding: .35rem 0; text-align: right; }
.version-row:disabled { opacity: 1; cursor: default; }
.version-row .item-main { flex: 1 1 9rem; }
.version-row > .ico { color: var(--soft); transition: rotate .2s; } .version-row > .ico.turned { rotate: 180deg; }
.version > .stack { padding: .2rem 0 .8rem; }
.diff { border-radius: .75rem; padding: .45rem .7rem; }
.diff p { overflow-wrap: anywhere; font-size: .92rem; border-top: 1px solid rgb(128 128 128 / .25); padding: .2rem 0; }
.diff.good { background: var(--green-bg); } .diff.bad { background: var(--red-bg); } .diff.warn { background: var(--amber-bg); }

/* ---------------------------------------------------------------- reports */
.center { text-align: center; }
.stats.pair { grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.2rem), 1fr)); }
.print-head { display: none; }
.export { display: flex; flex-direction: column; gap: .35rem; }
.export-row { display: flex; flex-wrap: wrap; gap: .45rem; }
.export-row .btn { flex: 1 1 8.5rem; }
.result { display: flex; flex-direction: column; align-items: center; border-radius: 1.1rem; padding: .8rem; container-type: inline-size; }
.result.in { background: var(--green-bg); color: var(--green); } .result.out { background: var(--red-bg); color: var(--red); }
.result small { font-weight: 900; font-size: 1rem; }
.result .num { font-size: min(2.1rem, calc(150cqi / var(--len, 8))); color: inherit; }
.bars { display: flex; flex-direction: column; gap: .65rem; }
.bar-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .6rem; }
.bar-label { flex: 1 1 9rem; font-weight: 800; overflow-wrap: anywhere; }
.bar-line .num { margin-inline-start: auto; }
.bar-track { flex: 0 0 100%; height: .5rem; border-radius: 99px; background: var(--ground); overflow: hidden; }
.bar-track > span { display: block; height: 100%; border-radius: 99px; }
.bar-track.in > span { background: var(--green); } .bar-track.out > span { background: var(--red); }
.rtable-box { overflow: hidden; }
.card .rtable-box { margin: 0; }
.rtable { display: block; width: 100%; border-collapse: collapse; }
.rtable thead { display: none; }
.rtable tbody, .rtable tfoot { display: block; }
.rtable tr { display: flex; flex-wrap: wrap; align-items: stretch; gap: .25rem .4rem; padding: .6rem 0; }
.rtable tr + tr, .rtable tfoot tr { border-top: 1px solid var(--line); }
.rtable tfoot tr { border-top-width: 3px; }
.rtable td { display: block; padding: 0; min-width: 0; text-align: right; }
.rtable td.blank { display: none; }
.rtable td.k-date { flex: 0 0 auto; color: var(--soft); font-weight: 800; font-size: .92rem; align-self: baseline; }
.rtable td.k-text { flex: 1 1 11rem; font-weight: 800; overflow-wrap: anywhere; align-self: baseline; }
.rtable td.k-text:first-child { flex-basis: 100%; }
.rtable td.k-text a { text-decoration: underline; text-underline-offset: .25em; }
.rtable td.k-text small { display: block; color: var(--soft); font-weight: 600; }
.rtable td:is(.k-up, .k-down, .k-bal, .k-num) { flex: 1 1 6.4rem; container-type: inline-size; border-radius: .65rem; padding: .15rem .5rem .25rem; }
.rtable td:is(.k-up, .k-down, .k-bal, .k-num)::before { content: attr(data-label); display: block; font-size: .8rem; font-weight: 800; }
.rtable td.k-up { background: var(--green-bg); color: var(--green); }
.rtable td.k-down { background: var(--red-bg); color: var(--red); }
.rtable td.k-bal { background: var(--blue-bg); color: var(--blue); }
.rtable td.k-num { background: var(--ground); }
.rtable td .num { color: inherit; }
@media (min-width: 760px), print {
  .rtable { display: table; }
  .rtable thead { display: table-header-group; }
  .rtable tbody { display: table-row-group; }
  .rtable tfoot { display: table-row-group; }
  .rtable tr { display: table-row; }
  .rtable th, .rtable td, .rtable td.blank, .rtable td:is(.k-up, .k-down, .k-bal, .k-num) { display: table-cell; border: 1px solid var(--line); border-radius: 0; padding: .3rem .55rem; vertical-align: middle; container-type: normal; }
  .rtable td:is(.k-up, .k-down, .k-bal, .k-num)::before { content: none; }
  .rtable th { color: #fff; background: var(--tile-cash); font-weight: 900; font-size: .92rem; }
  .rtable th.k-up { background: #0f6f38; } .rtable th.k-down { background: #ad1f37; } .rtable th.k-bal { background: #1f4099; }
  .rtable td.k-date { white-space: nowrap; }
  .rtable th.k-date, .rtable td.k-date { width: 1%; }
  .rtable td:is(.k-up, .k-down, .k-bal, .k-num) { white-space: nowrap; width: 1%; }
  .rtable td .num { font-size: 1em; }
  .rtable tfoot td { font-weight: 900; border-top-width: 2px; }
}

@media print {
  .print-head { display: block; text-align: center; margin-bottom: .6rem; }
  body { font-family: 'B Nazanin', Vazirmatn, Tahoma, sans-serif; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rtable-box { overflow: visible; }
  .rtable tr { break-inside: avoid; }
  .card { border: 0; box-shadow: none; padding: 0; break-inside: auto !important; }
  .rtable th { background: #0d6975 !important; }
  .rtable th.k-up { background: #0f6f38 !important; } .rtable th.k-down { background: #ad1f37 !important; } .rtable th.k-bal { background: #1f4099 !important; }
  .empty .ico { display: none; }
  :root, html[data-theme] { --ground: #fff; --surface: #fff; --ink: #000; --soft: #333; --line: #999; color-scheme: light; }
  html, html[data-size] { font-size: 12.5px; }
  .tabs, .top, .trial, .toast, .no-print { display: none !important; }
  .shell { padding: 0; }
  main { padding: 0; max-width: none; }
  .card, .list { break-inside: avoid; }
  html[data-hide="1"] main .num { filter: none; }
}
.trend-box { margin: 0; }
@keyframes drop { from { translate: 0 -1rem; opacity: 0; } }
